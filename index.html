<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Hiba ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Georgia, serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3, #c471ed);
      color: white;
    }

    .container {
      text-align: center;
      padding: 30px;
      animation: appear 2s ease;
      z-index: 2;
    }

    h1 {
      margin: 0;
      font-size: clamp(55px, 11vw, 150px);
      line-height: 1;
      text-shadow:
        0 0 10px rgba(255,255,255,.8),
        0 0 30px rgba(255,80,130,.9),
        0 0 60px rgba(255,255,255,.5);
      animation: glow 2s infinite alternate;
    }

    p {
      margin-top: 30px;
      font-size: clamp(18px, 3vw, 30px);
      letter-spacing: 2px;
    }

    .heart {
      position: absolute;
      bottom: -50px;
      font-size: 30px;
      animation: float 8s linear infinite;
      opacity: .8;
    }

    .heart:nth-child(1) { left: 10%; animation-delay: 0s; }
    .heart:nth-child(2) { left: 30%; animation-delay: 2s; }
    .heart:nth-child(3) { left: 55%; animation-delay: 4s; }
    .heart:nth-child(4) { left: 75%; animation-delay: 1s; }
    .heart:nth-child(5) { left: 90%; animation-delay: 3s; }

    @keyframes float {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 0;
      }

      20% {
        opacity: 1;
      }

      100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
      }
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: scale(.7);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes glow {
      from {
        transform: scale(1);
      }

      to {
        transform: scale(1.04);
      }
    }
  </style>
</head>

<body>

  <div class="heart">❤️</div>
  <div class="heart">💖</div>
  <div class="heart">💕</div>
  <div class="heart">❤️</div>
  <div class="heart">💗</div>

  <div class="container">
    <h1>I LOVE YOU HIBA ❤️</h1>
    <p>Forever and always, with love — Mubeen ❤️</p>
  </div>

</body>
</html>
